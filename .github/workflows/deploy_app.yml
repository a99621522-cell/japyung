# 화면(app/) → Cloudflare Workers 자동 배포
#   main 에 app/ 또는 wrangler.jsonc 가 바뀌어 올라오면 Wrangler 로 misty-truth-03b6 에 올린다.
#   필요한 Secrets (저장소 Settings → Secrets and variables → Actions):
#     CLOUDFLARE_API_TOKEN  — Cloudflare 대시보드 → 내 프로필 → API 토큰 → 「Workers 편집」 템플릿으로 만든 토큰
#     CLOUDFLARE_ACCOUNT_ID — Workers & Pages 화면 오른쪽의 계정 ID
#   둘이 없으면 이 워크플로는 아무것도 하지 않고 안내만 남긴다(실패로 치지 않음).
name: 화면 배포 (Cloudflare Workers)
on:
  push:
    branches: [main]
    paths: ['app/**', 'wrangler.jsonc', '.github/workflows/deploy_app.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 토큰 확인
        id: tok
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 없어 배포를 건너뜁니다. 저장소 Secrets 에 넣으면 다음 푸시부터 자동 배포됩니다." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Wrangler 배포
        if: steps.tok.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 화면만 올리는 배포(assets 전용, main 없음)는 Wrangler 4 가 필요하다 — 액션 기본값 3.90 은 「Missing entry-point」로 실패 (2026-10-09)
          wranglerVersion: "4"
          command: deploy
